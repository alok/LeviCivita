name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run lake test
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          use-mathlib-cache: false
