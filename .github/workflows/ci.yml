name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run lake test
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          use-mathlib-cache: false
      - name: No sorry in the library
        run: |
          ~/.elan/bin/lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'\|declaration uses \`sorry\`" build.log; then
            echo "::error::the library contains sorry"; exit 1
          fi
